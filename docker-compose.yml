services:

  # ── Kafka Stack ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: news-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - news-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: news-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s  # ← evita o NodeExistsException no restart
    networks:
      - news-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: news-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: news-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - news-net

  # ── ElasticSearch Stack ──────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: news-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m  # ← era 512m, economiza ~256MB
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - news-net

  # kibana: removido → economiza ~300MB

  # ── Aplicação ────────────────────────────────────────────────
  producer:
    build: ./producer
    container_name: news-producer
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    networks:
      - news-net

  worker:
    build: ./workers
    container_name: news-worker
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - news-net

  api:
    build: ./api
    container_name: news-api
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    networks:
      - news-net

  frontend:
    build: ./frontend
    container_name: news-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - news-net

# ── Volumes ───────────────────────────────────────────────────
volumes:
  zookeeper_data:
  kafka_data:
  elastic_data:
  huggingface_cache:

# ── Networks ──────────────────────────────────────────────────
networks:
  news-net:
    driver: bridge
